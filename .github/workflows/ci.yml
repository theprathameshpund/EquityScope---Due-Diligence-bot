name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # No real keys in CI: config gets dummies, all LLM/EDGAR calls are mocked.
      GROQ_API_KEY: ci-dummy-key
      EDGAR_USER_AGENT: "EquityScope CI ci@example.com"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests evals

      - name: Mypy (strict)
        run: mypy

      - name: Unit tests
        run: pytest tests/unit -q

      - name: Integration tests (mocked LLM + recorded EDGAR fixtures)
        run: pytest tests/integration -q
