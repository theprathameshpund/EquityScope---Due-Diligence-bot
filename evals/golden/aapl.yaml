# Golden Q&A set for retrieval evaluation — Apple Inc. (AAPL).
#
# HOW TO FILL THIS IN (manual step — do not let an LLM invent answers):
#   1. Run `python -m src.rag.ingestion AAPL` so Apple's filings are indexed.
#   2. For each question, open the relevant filing on EDGAR, find the passage
#      that answers it, and copy 1-3 short DISTINCTIVE phrases (3-8 words,
#      verbatim from the filing) into expected_phrases.
#   3. A retrieval "hit" = any expected phrase appears in a retrieved chunk.
#      Phrases must be specific enough not to match unrelated chunks.
#
# Questions with an empty expected_phrases list are skipped by the eval.

ticker: AAPL
questions:
